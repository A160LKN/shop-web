name: Баг-репорт
description: Что-то работает не так, как должно
title: '[Баг] '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Что случилось
      description: Одно-два предложения — суть дефекта
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть …
        2. Нажать …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Текст ошибки, код ответа, скриншот или лог
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: 'Например: Chrome 131, macOS; живой сайт / локально; версия или коммит'
  - type: dropdown
    id: severity
    attributes:
      label: Серьёзность
      options:
        - Блокер — основной сценарий не работает
        - Критичный — потеря данных или денег, уязвимость
        - Значительный — функция работает неправильно
        - Незначительный — неудобство, текст, вёрстка
    validations:
      required: true
